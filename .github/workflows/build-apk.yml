name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform-tools + build-tools
        run: |
          mkdir -p $ANDROID_HOME/platform-tools $ANDROID_HOME/build-tools
          yes | sdkmanager --install "platform-tools" "build-tools;34.0.0" 2>&1 | tail -2
          yes | sdkmanager --licenses 2>&1 | tail -1

      - name: Download Godot 4.4.1
        run: |
          mkdir -p godot
          curl -L -o godot/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          curl -L -o godot/templates.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q godot/godot.zip -d godot
          chmod +x godot/Godot_v4.4.1-stable_linux.x86_64
          unzip -q godot/templates.zip -d godot/templates
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          cp -r godot/templates/. ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Import project (ETC2/ASTC)
        run: godot/Godot_v4.4.1-stable_linux.x86_64 --headless --import

      - name: Export debug APK
        run: |
          mkdir -p build
          godot/Godot_v4.4.1-stable_linux.x86_64 --headless --export-debug Android build/FalkoMent-debug.apk

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify build/FalkoMent-debug.apk
          ls -lh build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FalkoMent-Sakuga-APK
          path: build/FalkoMent-debug.apk
